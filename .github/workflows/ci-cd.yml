name: CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  tests:
    permissions:
      contents: read
      packages: write

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: approval
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/approval
        run: poetry run alembic upgrade head

      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: createdb --host=localhost --username=postgres test_approve_db

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/approval
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_approve_db
        run: poetry run pytest

      - name: Build Docker Image
        run: docker build -t approval-api:latest .

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Tag Docker image
        run: docker tag approval-api:latest ghcr.io/whiplash153/approval-api:latest

      - name: Push Docker image
        run: docker push ghcr.io/whiplash153/approval-api:latest

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/apps/approval-system
            git pull
            docker pull ghcr.io/whiplash153/approval-api:latest
            docker compose run --rm backend alembic upgrade head
            docker compose up -d
            curl --fail --retry 5 --retry-delay 2 --retry-connrefused http://localhost:8001/health
