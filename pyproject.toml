[project]
name = "approval-system"
version = "0.1.0"
description = "Approval workflow API built with FastAPI"
authors = [
    {name = "Mikhail Mashenistov",email = "pr.mashinistov@gmail.com"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "fastapi (==0.135.1)",
    "sqlalchemy (==2.0.48)",
    "alembic (==1.18.4)",
    "psycopg2-binary (==2.9.11)",
    "pydantic (==2.12.5)",
    "uvicorn (==0.42.0)",
    "python-dotenv (==1.2.2)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
